# Checks every pull request and every push to main with the commands every builder finishes with:
# pnpm check, then on its build the Chromium browser tests in shards, a latency job, Firefox and
# WebKit, and Lighthouse; one job named ci waits for all of them. See README.md, "Checks".
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request stops its older run; every commit on main finishes its own.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            .next/
            !.next/cache
            src/content/generated/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Browser tests ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Sized from measured test times: 4 shards of 2 workers take about 5 minutes each.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      # Every Chromium project; Firefox and WebKit run in the engines job.
      - run: >-
          pnpm check:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --project='chromium-*' --project=reflow --project=reduced-motion
          --project=crawler
        env:
          E2E_SCOPE: full
          # The private repo's runner has 2 vCPUs, so 50% is one worker; the matrix shards for parallelism.
          E2E_WORKERS: 50%
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 3

  latency:
    name: Latency
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      # The specs throttle the CPU 4x, so nothing else may run beside them.
      - run: pnpm check:e2e --project=latency
        env:
          E2E_SCOPE: full
          E2E_WORKERS: 1
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-latency-${{ github.run_attempt }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 3

  engines:
    name: Firefox and WebKit
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-engines-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm check:e2e --project=firefox-360 --project=webkit-360
        env:
          E2E_SCOPE: full
          E2E_WORKERS: 50%
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-engines-${{ github.run_attempt }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 3

  flags-off:
    # Production's flag set: a link to a switched-off page would otherwise first fail live.
    name: Browser tests with every feature off
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Flags are read at build, so this job builds its own site rather than reuse check's.
    env:
      FEATURE_QUESTIONNAIRE_PREVIEW: '0'
      FEATURE_CONCEPT_MAP: '0'
      FEATURE_DEVANAGARI_FIRST: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:e2e
        env:
          E2E_ONLY: crawler,pages
          # The crawler follows every link whatever the scope; the pages spec takes each kind once.
          E2E_SCOPE: sample
          E2E_WORKERS: 50%

  report:
    name: Browser test report
    needs: [e2e, latency, engines]
    # Merges whatever the shards reported, pass or fail.
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' && needs.latency.result != 'skipped' && needs.engines.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: blobs/
      # A re-run job uploads under its new attempt; each job's latest blobs are the ones to merge.
      - run: |
          mkdir blob-report
          for job in $(ls blobs | sed -E 's/-[0-9]+$//' | sort -u); do
            latest="$(ls blobs | grep -E "^$job-[0-9]+$" | sort -V | tail -n 1)"
            # Unsharded jobs can name their blobs alike, so each copy carries its job's name.
            for f in blobs/"$latest"/*; do cp "$f" blob-report/"$job-$(basename "$f")"; done
          done
      - run: pnpm exec playwright merge-reports --reporter html blob-report/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: .
      - run: pnpm lhci
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          overwrite: true
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  gate:
    # main's ruleset requires a check by this name.
    name: ci
    needs: [check, e2e, latency, engines, flags-off, report, lighthouse]
    # A skipped required check counts as passing, so this runs whatever happened before it.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: A needed job didn't succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
